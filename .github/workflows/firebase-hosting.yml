# Publica o site no Firebase Hosting (lecinolucas.web.app) a cada merge na main,
# mas só depois que as verificações de qualidade (ci.yml) passarem.
# Autenticação sem chave: o GitHub se identifica ao Google por Workload Identity
# Federation (OIDC). Nenhum segredo é guardado no repositório. Ver ADR 0002 e 0003.
name: Publicar no Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca duas publicações ao mesmo tempo; a segunda espera a primeira terminar.
concurrency:
  group: publicar-firebase
  cancel-in-progress: false

jobs:
  verificar:
    uses: ./.github/workflows/ci.yml
    with:
      guardar_dist: true

  publicar:
    # Sem sucesso em "verificar", este job não executa.
    needs: verificar
    # Só a main publica. Uma execução manual a partir de outra branch roda as
    # verificações, mas não publica.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar o build que passou nas verificações
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Autenticar no Google (sem chave)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/475271784563/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: deploy-hosting@portifolio-509500.iam.gserviceaccount.com
      - name: Publicar
        run: npx firebase-tools deploy --only hosting --project portifolio-509500
